kind = "web"
previewPath = "/"
title = "DHD Livraison"
description = "Professional HR management platform for DHD Livraison delivery company. Manages employees, attendance (QR + GPS verification), payroll, advances, leave and vacation requests for two fixed offices. Features real-time sync, multilingual support (Arabic/French/English), dark mode, and PDF payslip generation."
version = "1.0.0"
id = "artifacts/dhd-livraison"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22444

[services.development]
run = "pnpm --filter @workspace/dhd-livraison run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dhd-livraison", "run", "build" ]
serve = "static"
publicDir = "artifacts/dhd-livraison/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22444"
BASE_PATH = "/"
