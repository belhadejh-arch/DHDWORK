  <body>
    <div id="root"></div>
    <section id="boot-fallback" dir="rtl" aria-live="polite">
      <div class="boot-fallback__card">
        <div class="boot-fallback__brand">DHD Livraison</div>
        <h1>تسجيل دخول الأدمن</h1>
        <p class="boot-fallback__hint">جارٍ تحميل الواجهة الرئيسية...</p>
        <form id="boot-login-form">
          <label>
            معرّف حساب الأدمن
            <input name="identifier" type="text" autocomplete="username" placeholder="البريد أو اسم المستخدم" required />
          </label>
          <label>
            كلمة المرور
            <input name="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required />
          </label>
          <button type="submit">تسجيل الدخول</button>
          <p id="boot-login-error" class="boot-fallback__error" role="alert"></p>
        </form>
        <a class="boot-fallback__employee-link" href="/portal">الدخول إلى حساب الموظف</a>
        <button id="boot-qr-login" class="boot-fallback__reload" type="button">الدخول عبر QR</button>
        <button id="boot-reload" class="boot-fallback__reload" type="button">إعادة تحميل الصفحة</button>
      </div>
    </section>
    <style>
      #boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        padding: 1.25rem;
        background: #f4f7fb;
        color: #172033;
        font-family: Arial, sans-serif;
      }
      #boot-fallback.is-hidden { display: none; }
      .boot-fallback__card {
        width: min(100%, 420px);
        padding: 2rem;
        border: 1px solid #dbe3ee;
        border-radius: 1.25rem;
        background: #fff;
        box-shadow: 0 18px 50px rgba(30, 52, 82, .12);
      }
      .boot-fallback__brand { color: #f97316; font-size: 1.15rem; font-weight: 800; }
      .boot-fallback__card h1 { margin: .75rem 0 .35rem; font-size: 1.35rem; }
      .boot-fallback__hint { margin: 0 0 1.25rem; color: #64748b; font-size: .9rem; }
      .boot-fallback__card label { display: block; margin-top: .9rem; color: #334155; font-size: .85rem; font-weight: 700; }
      .boot-fallback__card input {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin-top: .4rem;
        padding: .8rem .9rem;
        border: 1px solid #cbd5e1;
        border-radius: .7rem;
        background: #fff;
        color: #172033;
        font: inherit;
      }
      .boot-fallback__card button[type="submit"] {
        width: 100%;
        margin-top: 1.25rem;
        padding: .85rem 1rem;
        border: 0;
        border-radius: .7rem;
        background: #f97316;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }
      .boot-fallback__card button:disabled { opacity: .65; cursor: wait; }
      .boot-fallback__error { min-height: 1.2rem; margin: .7rem 0 0; color: #dc2626; font-size: .85rem; }
      .boot-fallback__employee-link,
      .boot-fallback__reload {
        display: block;
        width: fit-content;
        margin: 1rem auto 0;
        border: 0;
        background: transparent;
        color: #475569;
        cursor: pointer;
        font: inherit;
        font-size: .86rem;
        text-decoration: none;
      }
      .boot-fallback__reload { margin-top: .55rem; color: #f97316; }
      @media (max-width: 430px) {
        #boot-fallback { align-items: flex-start; padding-top: max(1rem, env(safe-area-inset-top)); }
        .boot-fallback__card { padding: 1.35rem; }
      }
    </style>
    <script>
      (function () {
        var root = document.getElementById('root');
        var fallback = document.getElementById('boot-fallback');
        var form = document.getElementById('boot-login-form');
        var error = document.getElementById('boot-login-error');
        var reload = document.getElementById('boot-reload');
        var isAdminEntry = /^\/?$/.test(window.location.pathname);
        var appLoaded = false;
        var loadReactApp = function () {
          if (appLoaded) return;
          appLoaded = true;
           fallback.classList.add('is-hidden');
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = '/assets/index-DYVlzey9.js';
          document.head.appendChild(script);
        };
        var hideIfReactMounted = function () {
          if (!root || !root.childNodes.length) return;
          var hasRenderedLogin = root.querySelector('form input');
          if (!isAdminEntry || hasRenderedLogin) fallback.classList.add('is-hidden');
        };
        new MutationObserver(hideIfReactMounted).observe(root, { childList: true });
        window.setTimeout(hideIfReactMounted, 1200);
        window.addEventListener('error', function () {
          fallback.classList.remove('is-hidden');
          var hint = fallback.querySelector('.boot-fallback__hint');
          if (hint) hint.textContent = 'تعذر تحميل الواجهة تلقائياً. يمكنك تسجيل الدخول من هنا.';
        });
        window.addEventListener('unhandledrejection', function () {
          fallback.classList.remove('is-hidden');
          var hint = fallback.querySelector('.boot-fallback__hint');
          if (hint) hint.textContent = 'حدث خطأ أثناء تحميل الواجهة. يمكنك تسجيل الدخول من هنا.';
        });
        document.getElementById('boot-qr-login').addEventListener('click', function () {
          fallback.classList.add('is-hidden');
          loadReactApp();
        });
        reload.addEventListener('click', function () { window.location.reload(); });
        form.addEventListener('submit', async function (event) {
          event.preventDefault();
          var button = form.querySelector('button[type="submit"]');
          var data = new FormData(form);
          button.disabled = true;
          error.textContent = '';
          try {
            var response = await fetch('/api/auth/login', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: data.get('identifier'),
                username: data.get('identifier'),
                password: data.get('password')
              })
            });
            var body = await response.json().catch(function () { return {}; });
            if (!response.ok || !body.token || body.userType !== 'admin') {
              throw new Error(body.message || body.error || 'بيانات الدخول غير صحيحة');
            }
            localStorage.setItem('dhd_admin_token', body.token);
            window.location.assign('/offices');
          } catch (submitError) {
            error.textContent = submitError.message || 'تعذر الاتصال بالخادم';
          } finally {
            button.disabled = false;
          }
        });
         // Always load the original application shell, including at the admin
         // entry route. Its bundled login is the canonical admin login screen.
         // The boot form remains available only if the bundle genuinely fails.
         loadReactApp();
      })();
    </script>
  </body>
</html>
