<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كشف الراتب المفصل — DHD Livraison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f7fa; color: #18243b; font: 15px/1.65 system-ui, sans-serif; }
    .shell { width: min(100% - 28px, 1024px); margin: 0 auto; padding: 20px 0 72px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { font-size: clamp(22px, 5vw, 32px); margin: 0; }
    h2 { font-size: 18px; margin: 0 0 14px; }
    p { margin: 5px 0; }
    .muted { color: #697587; }
    a, button { font: inherit; }
    .action { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 8px 16px; border: 1px solid #e57000; border-radius: 12px; background: #fff; color: #aa4d00; text-decoration: none; cursor: pointer; font-weight: 700; }
    .action.primary, .period[aria-pressed="true"] { background: #ef7800; border-color: #ef7800; color: #fff; }
    .card { padding: 18px; border: 1px solid #e6eaf0; border-radius: 18px; background: #fff; margin: 12px 0; }
    .periods { display: flex; gap: 8px; flex-wrap: wrap; }
    .period { min-height: 42px; border: 1px solid #dadfe8; border-radius: 10px; background: #fff; padding: 6px 14px; cursor: pointer; }
    .status { padding: 16px; border-radius: 14px; background: #fff7ed; color: #93420a; margin: 14px 0; }
    .status[hidden], .card[hidden] { display: none; }
    .status.error { background: #fff0f0; color: #b42318; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 10px; }
    .metric { padding: 12px; border-radius: 12px; background: #f8fafc; }
    .metric span { display: block; color: #667085; font-size: 12px; }
    .metric strong { display: block; font-size: 17px; overflow-wrap: anywhere; }
    .metric.net { background: #fff3e5; }
    .metric.net strong { color: #ad4b00; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px; text-align: right; border-bottom: 1px solid #edf0f4; vertical-align: top; }
    th { background: #f8fafc; white-space: nowrap; }
    .empty { color: #697587; text-align: center; }
    .error-actions { margin-top: 12px; }
    @media print {
      body { background: #fff; }
      .no-print, .status { display: none !important; }
      .shell { width: 100%; padding: 0; }
      .card { break-inside: avoid; box-shadow: none; }
    }
  </style>
  <script defer src="/employee-payslip.js"></script>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="muted">DHD Livraison · حساب الموظف</p><h1>كشف الراتب المفصل</h1></div>
      <a class="action no-print" href="/portal/account">العودة إلى حسابي</a>
    </header>
    <div id="status" class="status" role="status">جارٍ تحميل كشوف الرواتب…</div>
    <section id="period-card" class="card no-print" hidden>
      <h2>اختر فترة الراتب</h2>
      <div id="periods" class="periods"></div>
    </section>
    <div id="statement"></div>
  </main>
</body>
</html>
