openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DHD Livraison HR Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: offices
    description: Office management
  - name: employees
    description: Employee management
  - name: attendance
    description: Attendance tracking
  - name: salaries
    description: Salary management
  - name: advances
    description: Salary advances
  - name: leave-requests
    description: Leave/absence requests
  - name: vacation-requests
    description: Vacation requests
  - name: notifications
    description: Notifications
  - name: settings
    description: System settings
  - name: stats
    description: Statistics and dashboard
  - name: violations
    description: Employee violations and deductions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current admin
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          description: Not authenticated

  /auth/change-password:
    patch:
      operationId: changePassword
      tags: [auth]
      summary: Change admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
        "400":
          description: Invalid current password

  /auth/change-email:
    patch:
      operationId: changeEmail
      tags: [auth]
      summary: Change admin email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailInput"
      responses:
        "200":
          description: Email changed
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email:
                    type: string
        "400":
          description: Invalid password or email already in use

  # ── OFFICES ───────────────────────────────────────────────────────────────
  /offices:
    get:
      operationId: listOffices
      tags: [offices]
      summary: List all offices
      responses:
        "200":
          description: List of offices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Office"

  /offices/{id}:
    get:
      operationId: getOffice
      tags: [offices]
      summary: Get office by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Office details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Office"
        "404":
          description: Office not found

  /offices/{id}/qrcode:
    get:
      operationId: getOfficeQrCode
      tags: [offices]
      summary: Get QR code data for office attendance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: QR code token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCodeResponse"

  # ── EMPLOYEES ─────────────────────────────────────────────────────────────
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees, optionally filtered by office
      parameters:
        - name: officeId
          in: query
          schema:
            type: number
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Employee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Employee not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /employees/attendance-summary:
    get:
      operationId: getEmployeeAttendanceSummary
      tags: [employees]
      summary: Get attendance summary for an employee
      parameters:
        - name: employeeId
          in: query
          required: true
          schema:
            type: number
        - name: month
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Attendance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummary"

  /employees/{id}/salary-history:
    get:
      operationId: getEmployeeSalaryHistory
      tags: [employees]
      summary: Get salary history for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Salary history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salary"

  # ── ATTENDANCE ────────────────────────────────────────────────────────────
  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: employeeId
          in: query
          schema:
            type: number
        - name: officeId
          in: query
          schema:
            type: number
        - name: date
          in: query
          schema:
            type: string
        - name: month
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"

  /attendance/checkin:
    post:
      operationId: checkIn
      tags: [attendance]
      summary: Record employee check-in (requires QR token + GPS coords)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceCheckInput"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Invalid GPS/QR or outside 5m radius

  /attendance/checkout:
    post:
      operationId: checkOut
      tags: [attendance]
      summary: Record employee check-out (requires QR token + GPS coords)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceCheckInput"
      responses:
        "200":
          description: Check-out recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Invalid GPS/QR or outside 5m radius

  /attendance/{id}:
    get:
      operationId: getAttendanceRecord
      tags: [attendance]
      summary: Get attendance record by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
    patch:
      operationId: updateAttendanceRecord
      tags: [attendance]
      summary: Admin correction of attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRecordUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  # ── SALARIES ──────────────────────────────────────────────────────────────
  /salaries:
    get:
      operationId: listSalaries
      tags: [salaries]
      summary: List salary records
      parameters:
        - name: employeeId
          in: query
          schema:
            type: number
        - name: officeId
          in: query
          schema:
            type: number
        - name: month
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, postponed]
      responses:
        "200":
          description: Salary records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salary"
    post:
      operationId: generateSalaries
      tags: [salaries]
      summary: Generate salary records for a month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSalariesInput"
      responses:
        "201":
          description: Salaries generated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salary"

  /salaries/{id}:
    get:
      operationId: getSalary
      tags: [salaries]
      summary: Get salary record by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Salary record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salary"

  /salaries/{id}/pay:
    patch:
      operationId: paySalary
      tags: [salaries]
      summary: Mark salary as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Marked as paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salary"

  /salaries/{id}/postpone:
    patch:
      operationId: postponeSalary
      tags: [salaries]
      summary: Postpone salary payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostponeSalaryInput"
      responses:
        "200":
          description: Postponed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salary"

  /salaries/{id}/payslip:
    get:
      operationId: getSalaryPayslip
      tags: [salaries]
      summary: Get payslip data for PDF generation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Payslip data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payslip"

  # ── ADVANCES ──────────────────────────────────────────────────────────────
  /advances:
    get:
      operationId: listAdvances
      tags: [advances]
      summary: List advance requests
      parameters:
        - name: employeeId
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Advance requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advance"
    post:
      operationId: createAdvance
      tags: [advances]
      summary: Request a salary advance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceInput"
      responses:
        "201":
          description: Advance requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advance"

  /advances/{id}/approve:
    patch:
      operationId: approveAdvance
      tags: [advances]
      summary: Approve advance request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advance"

  /advances/{id}/reject:
    patch:
      operationId: rejectAdvance
      tags: [advances]
      summary: Reject advance request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advance"

  # ── LEAVE REQUESTS ────────────────────────────────────────────────────────
  /leave-requests:
    get:
      operationId: listLeaveRequests
      tags: [leave-requests]
      summary: List leave/absence requests
      parameters:
        - name: employeeId
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
    post:
      operationId: createLeaveRequest
      tags: [leave-requests]
      summary: Submit a leave/absence request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestInput"
      responses:
        "201":
          description: Leave request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"

  /leave-requests/{id}/approve:
    patch:
      operationId: approveLeaveRequest
      tags: [leave-requests]
      summary: Approve leave request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"

  /leave-requests/{id}/reject:
    patch:
      operationId: rejectLeaveRequest
      tags: [leave-requests]
      summary: Reject leave request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"

  # ── VACATION REQUESTS ─────────────────────────────────────────────────────
  /vacation-requests:
    get:
      operationId: listVacationRequests
      tags: [vacation-requests]
      summary: List vacation requests
      parameters:
        - name: employeeId
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Vacation requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VacationRequest"
    post:
      operationId: createVacationRequest
      tags: [vacation-requests]
      summary: Submit a vacation request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VacationRequestInput"
      responses:
        "201":
          description: Vacation request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacationRequest"

  /vacation-requests/{id}/approve:
    patch:
      operationId: approveVacationRequest
      tags: [vacation-requests]
      summary: Approve vacation request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacationRequest"

  /vacation-requests/{id}/reject:
    patch:
      operationId: rejectVacationRequest
      tags: [vacation-requests]
      summary: Reject vacation request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacationRequest"

  # ── NOTIFICATIONS ─────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current admin
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked as read

  # ── SETTINGS ──────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get system settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update system settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  # ── VIOLATIONS ────────────────────────────────────────────────────────────
  /violations:
    get:
      operationId: listViolations
      tags: [violations]
      summary: List violations (admin)
      parameters:
        - name: employeeId
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, deducted]
      responses:
        "200":
          description: List of violations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Violation"
    post:
      operationId: createViolation
      tags: [violations]
      summary: Create a violation (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViolationInput"
      responses:
        "201":
          description: Violation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Violation"

  /violations/{id}:
    patch:
      operationId: updateViolation
      tags: [violations]
      summary: Update a violation (admin, only if pending)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViolationUpdate"
      responses:
        "200":
          description: Violation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Violation"
        "404":
          description: Not found
        "409":
          description: Cannot modify a deducted violation
    delete:
      operationId: deleteViolation
      tags: [violations]
      summary: Delete a violation (admin, only if pending)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Cannot delete a deducted violation

  # ── STATS ─────────────────────────────────────────────────────────────────
  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get overall dashboard statistics
      parameters:
        - name: month
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/office:
    get:
      operationId: getOfficeStats
      tags: [stats]
      summary: Get statistics for a specific office
      parameters:
        - name: officeId
          in: query
          required: true
          schema:
            type: number
        - name: month
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Office statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeStats"

  /stats/attendance-chart:
    get:
      operationId: getAttendanceChart
      tags: [stats]
      summary: Get attendance chart data (daily counts for a month)
      parameters:
        - name: officeId
          in: query
          schema:
            type: number
        - name: month
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartDataPoint"

  /stats/salary-chart:
    get:
      operationId: getSalaryChart
      tags: [stats]
      summary: Get salary trends chart data (monthly totals)
      parameters:
        - name: officeId
          in: query
          schema:
            type: number
        - name: year
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Salary chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartDataPoint"

# ── COMPONENTS ──────────────────────────────────────────────────────────────
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # AUTH
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [admin, token]
      properties:
        admin:
          $ref: "#/components/schemas/Admin"
        token:
          type: string

    Admin:
      type: object
      required: [id, username, email, createdAt]
      properties:
        id:
          type: number
        username:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        serialNumber:
          type: ["string", "null"]
        qrCodeData:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    ChangeEmailInput:
      type: object
      required: [currentPassword, newEmail]
      properties:
        currentPassword:
          type: string
        newEmail:
          type: string

    # OFFICES
    Office:
      type: object
      required: [id, name, latitude, longitude, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        createdAt:
          type: string
          format: date-time

    QrCodeResponse:
      type: object
      required: [officeId, token, expiresAt]
      properties:
        officeId:
          type: number
        token:
          type: string
        expiresAt:
          type: string
          format: date-time

    # EMPLOYEES
    Employee:
      type: object
      required: [id, officeId, firstName, lastName, phone, position, baseSalary, workStartTime, workEndTime, createdAt]
      properties:
        id:
          type: number
        officeId:
          type: number
        officeName:
          type: ["string", "null"]
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        position:
          type: string
        baseSalary:
          type: number
        workStartTime:
          type: string
          description: "HH:MM format"
        workEndTime:
          type: string
          description: "HH:MM format"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    EmployeeInput:
      type: object
      required: [officeId, firstName, lastName, phone, position, baseSalary, workStartTime, workEndTime]
      properties:
        officeId:
          type: number
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        position:
          type: string
        baseSalary:
          type: number
        workStartTime:
          type: string
        workEndTime:
          type: string

    EmployeeUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        position:
          type: string
        baseSalary:
          type: number
        workStartTime:
          type: string
        workEndTime:
          type: string
        isActive:
          type: boolean

    AttendanceSummary:
      type: object
      required: [employeeId, month, year, presentDays, absentDays, lateDays, totalHours, overtimeHours, totalDeductions, totalBonuses]
      properties:
        employeeId:
          type: number
        month:
          type: string
        year:
          type: number
        presentDays:
          type: number
        absentDays:
          type: number
        lateDays:
          type: number
        totalHours:
          type: number
        overtimeHours:
          type: number
        totalDeductions:
          type: number
        totalBonuses:
          type: number

    # ATTENDANCE
    AttendanceRecord:
      type: object
      required: [id, employeeId, date, createdAt]
      properties:
        id:
          type: number
        employeeId:
          type: number
        employeeName:
          type: ["string", "null"]
        officeId:
          type: number
        officeName:
          type: ["string", "null"]
        date:
          type: string
        checkInTime:
          type: ["string", "null"]
        checkOutTime:
          type: ["string", "null"]
        checkInLat:
          type: ["number", "null"]
        checkInLng:
          type: ["number", "null"]
        checkOutLat:
          type: ["number", "null"]
        checkOutLng:
          type: ["number", "null"]
        workedMinutes:
          type: ["number", "null"]
        lateMinutes:
          type: ["number", "null"]
        overtimeMinutes:
          type: ["number", "null"]
        lateDeduction:
          type: ["number", "null"]
        overtimeBonus:
          type: ["number", "null"]
        isAbsent:
          type: boolean
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AttendanceCheckInput:
      type: object
      required: [employeeId, qrToken, latitude, longitude]
      properties:
        employeeId:
          type: number
        qrToken:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    AttendanceRecordUpdate:
      type: object
      properties:
        checkInTime:
          type: string
        checkOutTime:
          type: string
        isAbsent:
          type: boolean
        notes:
          type: string

    # SALARIES
    Salary:
      type: object
      required: [id, employeeId, month, year, baseSalary, status, createdAt]
      properties:
        id:
          type: number
        employeeId:
          type: number
        employeeName:
          type: ["string", "null"]
        officeId:
          type: ["number", "null"]
        officeName:
          type: ["string", "null"]
        month:
          type: string
        year:
          type: number
        baseSalary:
          type: number
        presentDays:
          type: number
        absentDays:
          type: number
        workedHours:
          type: number
        overtimeHours:
          type: number
        overtimeBonus:
          type: number
        lateDeductions:
          type: number
        advanceDeductions:
          type: number
        otherDeductions:
          type: number
        violationDeductions:
          type: number
        bonuses:
          type: number
        finalSalary:
          type: number
        status:
          type: string
          enum: [pending, paid, postponed]
        paidAt:
          type: ["string", "null"]
          format: date-time
        postponedUntil:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    GenerateSalariesInput:
      type: object
      required: [month, year]
      properties:
        month:
          type: string
        year:
          type: number
        officeId:
          type: number

    PostponeSalaryInput:
      type: object
      required: [days]
      properties:
        days:
          type: number
          enum: [1, 2, 3, 5, 6, 7]

    Payslip:
      type: object
      required: [salary, employee, office]
      properties:
        salary:
          $ref: "#/components/schemas/Salary"
        employee:
          $ref: "#/components/schemas/Employee"
        office:
          $ref: "#/components/schemas/Office"
        companyName:
          type: string
        companyLogo:
          type: ["string", "null"]

    # ADVANCES
    Advance:
      type: object
      required: [id, employeeId, amount, status, requestedAt]
      properties:
        id:
          type: number
        employeeId:
          type: number
        employeeName:
          type: ["string", "null"]
        officeName:
          type: ["string", "null"]
        amount:
          type: number
        reason:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: ["string", "null"]
        requestedAt:
          type: string
          format: date-time
        resolvedAt:
          type: ["string", "null"]
          format: date-time

    AdvanceInput:
      type: object
      required: [employeeId, amount]
      properties:
        employeeId:
          type: number
        amount:
          type: number
        reason:
          type: string

    RejectInput:
      type: object
      properties:
        reason:
          type: string

    # LEAVE REQUESTS
    LeaveRequest:
      type: object
      required: [id, employeeId, leaveType, startDate, endDate, status, requestedAt]
      properties:
        id:
          type: number
        employeeId:
          type: number
        employeeName:
          type: ["string", "null"]
        officeName:
          type: ["string", "null"]
        leaveType:
          type: string
          enum: [medical, family, personal, other]
        startDate:
          type: string
        endDate:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: ["string", "null"]
        requestedAt:
          type: string
          format: date-time
        resolvedAt:
          type: ["string", "null"]
          format: date-time

    LeaveRequestInput:
      type: object
      required: [employeeId, leaveType, startDate, endDate]
      properties:
        employeeId:
          type: number
        leaveType:
          type: string
          enum: [medical, family, personal, other]
        startDate:
          type: string
        endDate:
          type: string
        description:
          type: string

    # VACATION REQUESTS
    VacationRequest:
      type: object
      required: [id, employeeId, startDate, endDate, status, requestedAt]
      properties:
        id:
          type: number
        employeeId:
          type: number
        employeeName:
          type: ["string", "null"]
        officeName:
          type: ["string", "null"]
        startDate:
          type: string
        endDate:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: ["string", "null"]
        requestedAt:
          type: string
          format: date-time
        resolvedAt:
          type: ["string", "null"]
          format: date-time

    VacationRequestInput:
      type: object
      required: [employeeId, startDate, endDate]
      properties:
        employeeId:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        description:
          type: string

    # VIOLATIONS
    Violation:
      type: object
      required: [id, employeeId, reason, status, createdAt]
      properties:
        id:
          type: number
        employeeId:
          type: number
        employeeName:
          type: ["string", "null"]
        officeName:
          type: ["string", "null"]
        reason:
          type: string
        amount:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, deducted]
        salaryId:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ViolationInput:
      type: object
      required: [employeeId, reason]
      properties:
        employeeId:
          type: number
        reason:
          type: string
        amount:
          type: number
        notes:
          type: string

    ViolationUpdate:
      type: object
      properties:
        reason:
          type: string
        amount:
          type: number
        notes:
          type: string

    # NOTIFICATIONS
    Notification:
      type: object
      required: [id, type, message, isRead, createdAt]
      properties:
        id:
          type: number
        type:
          type: string
          enum: [advance_request, leave_request, vacation_request, salary_due, attendance_alert, late_alert, violation_added, general]
        message:
          type: string
        referenceId:
          type: ["number", "null"]
        referenceType:
          type: ["string", "null"]
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # SETTINGS
    Settings:
      type: object
      required: [id, lateDeductionAmount, overtimeHourlyRate, paymentDayOfMonth, language, darkMode]
      properties:
        id:
          type: number
        lateDeductionAmount:
          type: number
          description: "Deduction in DZD for lateness > 15 min"
        overtimeHourlyRate:
          type: number
          description: "Bonus per overtime hour in DZD"
        paymentDayOfMonth:
          type: number
          description: "Day of month for salary payment"
        lateThresholdMinutes:
          type: number
          description: "Minutes late before deduction kicks in"
        language:
          type: string
          enum: [ar, fr, en]
        darkMode:
          type: boolean

    SettingsUpdate:
      type: object
      properties:
        lateDeductionAmount:
          type: number
        overtimeHourlyRate:
          type: number
        paymentDayOfMonth:
          type: number
        lateThresholdMinutes:
          type: number
        language:
          type: string
          enum: [ar, fr, en]
        darkMode:
          type: boolean

    # STATS
    DashboardStats:
      type: object
      required: [totalEmployees, presentToday, absentToday, lateToday, pendingRequests, totalSalariesThisMonth, totalAdvancesThisMonth]
      properties:
        totalEmployees:
          type: number
        presentToday:
          type: number
        absentToday:
          type: number
        lateToday:
          type: number
        pendingRequests:
          type: number
        pendingAdvances:
          type: number
        pendingLeaves:
          type: number
        pendingVacations:
          type: number
        totalSalariesThisMonth:
          type: number
        totalAdvancesThisMonth:
          type: number
        totalDeductionsThisMonth:
          type: number
        officeBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/OfficeStats"

    OfficeStats:
      type: object
      required: [officeId, officeName, totalEmployees, presentToday, absentToday, lateToday, totalSalaries, totalDeductions, totalAdvances, overtimeHours]
      properties:
        officeId:
          type: number
        officeName:
          type: string
        totalEmployees:
          type: number
        presentToday:
          type: number
        absentToday:
          type: number
        lateToday:
          type: number
        totalSalaries:
          type: number
        totalDeductions:
          type: number
        totalAdvances:
          type: number
        overtimeHours:
          type: number

    ChartDataPoint:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: number
        secondary:
          type: ["number", "null"]
