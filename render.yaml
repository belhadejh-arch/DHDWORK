services:
  - type: web
    name: dhd-livraison
    runtime: node
    plan: free
    buildCommand: npm install --prefix /tmp/pnpm-cli pnpm@10.26.1 && PATH=/tmp/pnpm-cli/node_modules/.bin:$PATH pnpm install --frozen-lockfile --prod=false && PATH=/tmp/pnpm-cli/node_modules/.bin:$PATH pnpm run build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false