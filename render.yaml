services:
  - type: web
    name: dhd-livraison
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@10.26.1 && pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false