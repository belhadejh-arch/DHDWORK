services:
  - type: web
    name: dhd-livraison-backend
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build --workspace=@workspace/api-server
    startCommand: npm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dhd-postgres
          property: connectionString

databases:
  - name: dhd-postgres
    plan: free
    databaseName: dhd_db
    user: dhd_user
